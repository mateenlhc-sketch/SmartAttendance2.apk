name: Build Installable Android APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Update Android SDK Command-Line Tools & Accept Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "cmdline-tools;latest" > /dev/null 2>&1 || true
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Environment & Signing Keystore
        run: |
          touch .env
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi
          if [ -s "debug.keystore.base64" ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app/src/main/assets
          if [ ! -s "app/src/main/assets/mobilefacenet.tflite" ]; then
            curl -fL "https://github.com/sirius-ai/MobileFaceNet_TF/raw/master/arch/pretrained_model/mobilefacenet.tflite" -o app/src/main/assets/mobilefacenet.tflite
          fi

      - name: Build Signed Installable APK
        run: |
          gradle :app:assembleDebug --no-daemon -Dorg.gradle.configuration-cache=false --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SmartAttendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-Android-APK
          path: SmartAttendance.apk

      - name: Publish Direct .apk Download to GitHub Releases
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-apk
          name: "Smart Attendance — Installable Android APK"
          body: |
            Tap **SmartAttendance.apk** below on your Android phone to download and install **AI Smart School Attendance System** directly.
            - Includes **Continue as Guest (No Login ID)** for instant offline demo & **Sign in with Google** for Firebase Cloud Firestore sync.
            - Bundled with on-device **192D MobileFaceNet** neural face recognition model.
          files: SmartAttendance.apk
          prerelease: false
